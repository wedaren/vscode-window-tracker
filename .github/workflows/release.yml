name: Build and Publish VSIX

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release tag
        run: |
          echo "GITHUB_REF=$GITHUB_REF"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            REF_NAME=${GITHUB_REF#refs/tags/}
            echo "RELEASE_TAG=${REF_NAME}" >> $GITHUB_ENV
          else
            VERSION=$(node -p "require('./package.json').version") || true
            if [[ -n "$VERSION" ]]; then
              echo "RELEASE_TAG=v$VERSION" >> $GITHUB_ENV
            else
              echo "RELEASE_TAG=main-${GITHUB_SHA::8}" >> $GITHUB_ENV
            fi
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Install vsce
        run: npm install -g vsce

      - name: Package extension (VSIX)
        run: |
          vsce package -o extension.vsix

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload VSIX to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./extension.vsix
          asset_name: extension.vsix
          asset_content_type: application/octet-stream

      - name: Publish to Visual Studio Marketplace (optional)
        if: ${{ secrets.VSCE_TOKEN != '' }}
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
        run: |
          # publish requires a 'publisher' field in package.json and a PAT stored in VSCE_TOKEN
          vsce publish --pat $VSCE_TOKEN
